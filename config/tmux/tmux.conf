# General
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-option -g status-keys vi
setw -g monitor-activity on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g escape-time 10
set -s extended-keys always
set -s extended-keys-format csi-u

# Keybindings
set-option -g prefix C-space
unbind-key C-a
bind-key C-space send-prefix


bind-key n display-panes
bind-key : command-prompt

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "sources tmux.conf"

bind-key [ copy-mode
setw -g mode-keys vi
bind-key -Tcopy-mode-vi n send-keys -X halfpage-down
bind-key -Tcopy-mode-vi p send-keys -X halfpage-up
bind-key -Tcopy-mode-vi v send-keys -X begin-selection
bind-key -Tcopy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -Tcopy-mode-vi y send-keys -X copy-selection
bind-key -Tcopy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -Tcopy-mode-vi Escape send-keys -X cancel

bind-key s choose-session

bind-key '%' split-window -h
bind-key '"' split-window -v
unbind-key q
bind-key q kill-pane

# Window focus
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Panes focus
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -n M-Left select-pane -L
bind-key -n M-Down select-pane -D
bind-key -n M-Up select-pane -U
bind-key -n M-Right select-pane -R

# Panes resize
bind-key -r > resize-pane -R 5
bind-key -r < resize-pane -L 5
bind-key -r - resize-pane -D 5
bind-key -r = resize-pane -U 6


# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.1.3'


# non-plugin ouption
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:usstyle:extkeys:focus"

# Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @thm_mantle "#1e1e2e"
set -g @catppuccin_window_status_style "rounded"

# Compatibility for the pre-TPM nested checkout. TPM installs catppuccin/tmux
# as plugins/tmux and sources it itself, so never source both copies.
if-shell '[ ! -f "$HOME/.config/tmux/plugins/tmux/catppuccin.tmux" ] && [ -f "$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux" ]' \
  'run-shell "$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell '[ -x "$HOME/.config/tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
